name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # -------------------------------------------------------------------
  # Syntax gate (fast, dependency-free): every shipped backend module
  # must COMPILE under Python 3.11 — the published floor
  # (pyproject requires-python ">=3.11"; CI and both Dockerfiles run
  # 3.11 images). 2026-10-10 incident: a 3.12+-only multiline f-string
  # (PEP 701) shipped and left every planner-importing suite unrunnable
  # under 3.11 while the 3.14 serving venv masked it. The exclusions
  # below are the genuinely archived trees ONLY (core/archive,
  # .archive, test_archives_*, scripts/dev one-offs) plus environments
  # and build output — anything else that fails to compile under 3.11
  # fails this gate.
  # -------------------------------------------------------------------
  syntax-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile all shipped backend modules under 3.11
        run: |
          python -m compileall -q -f -x '(^|/)(venv314|venv|node_modules|data|logs|__pycache__|coverage_html_batch|coverage_reports|htmlcov|\.pytest_cache|\.archive|archive|test_archives_[0-9]+_[0-9]+|scripts/dev)(/|$)' .
          echo "3.11 compile gate passed"

  # -------------------------------------------------------------------
  # Fast: does the full app even import + boot? (guards against the
  # historical "main_api_app is broken" regression)
  # -------------------------------------------------------------------
  full-app-boots:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Boot the full app (main_api_app) and hit /alive
        env:
          DATABASE_URL: "sqlite:///test_ci.db"
          SECRET_KEY: "ci-test-secret-key"
          ENVIRONMENT: "development"
          BYPASS_RATE_LIMIT: "1"
        run: |
          # Import first — surfaces any router/middleware error loudly.
          python -c "import main_api_app; print('import OK')"
          # Boot in the background and probe the health endpoint.
          python -m uvicorn main_api_app:app --host 127.0.0.1 --port 8001 &
          BACKEND_PID=$!
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:8001/alive > /dev/null 2>&1; then
              echo "Backend alive"; exit 0
            fi
            sleep 2
          done
          echo "Backend failed to boot"; kill $BACKEND_PID 2>/dev/null || true; exit 1

  # -------------------------------------------------------------------
  # Install path: does the documented `make setup` quickstart actually
  # work end-to-end for a new user? (venv, deps, .env generation)
  # -------------------------------------------------------------------
  quickstart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run make setup (quickstart.sh)
        run: make setup
      - name: Verify setup artifacts
        run: |
          test -d backend/venv
          test -f backend/.env
          test -d frontend-nextjs/node_modules
          test -f frontend-nextjs/.env.local
          grep -q "SECRET_KEY=" backend/.env
          echo "Quickstart artifacts OK"
      - name: Boot the full app from the generated env
        working-directory: backend
        run: |
          source venv/bin/activate
          python -m uvicorn main_api_app:app --host 127.0.0.1 --port 8001 > /tmp/quickstart-backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:8001/alive > /dev/null 2>&1 && { echo "Backend alive from quickstart env"; exit 0; }
            sleep 2
          done
          echo "Backend failed to boot from quickstart env:"; tail -40 /tmp/quickstart-backend.log; exit 1

  # -------------------------------------------------------------------
  # Backend unit tests (unchanged set, fast feedback)
  # -------------------------------------------------------------------
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run backend tests
        env:
          DATABASE_URL: "sqlite:///test_ci.db"
          SECRET_KEY: "ci-test-secret-key"
          ENVIRONMENT: "development"
          PYTEST_CURRENT_TEST: "1"
        run: |
          # --timeout seatbelt: a hung test fails at 5 min (thread stacks dumped
          # for triage) instead of burning the 6h job limit — the 2026-09-05
          # run hung 6h on one test (exhausted MagicMock side_effect raised
          # StopIteration inside to_thread; fixed in byok_handler + w27 test).
          python -m pytest tests/test_integration_http.py tests/test_local_models.py tests/test_routing_feedback_endpoint.py tests/test_phase_integration.py tests/test_response_quality.py tests/test_routing_trainer_integration.py tests/test_routing_db_persistence.py tests/test_round17b_fixes.py tests/test_learning_routing.py tests/test_learning_llm_router.py tests/test_workbook_runtime.py tests/test_canvas_crud.py tests/test_openrouter_provider.py tests/test_provider_wiring.py tests/api/test_a2a_routes.py tests/api/test_sso_oidc_routes.py tests/api/test_scim_routes.py tests/core/test_observability_tracing.py tests/core/test_oracle_and_two_tier_confidence.py tests/test_memory_p2.py tests/test_memory_consolidator_llm.py tests/test_memory_eval_gate.py tests/test_memory_backfill_unified.py tests/test_opencode_go_provider.py tests/test_covpush_w27_opencode_retry.py tests/test_covpush_w57_byok_handler_a.py tests/test_covpush_w57_byok_handler_d.py tests/unit/core/test_stage_router_wiring.py tests/unit/core/test_traffic_split.py tests/test_deepseek_harness_gaps.py tests/test_stream_retry_state_contract.py tests/test_community_skill_write_contract.py tests/test_quickstart_python_guard.py tests/test_workflow_hitl_resume_once.py tests/test_workflow_hitl_persisted_resume.py tests/test_workflow_scheduler_recovery.py tests/test_workflow_approval_scope.py tests/test_workflow_public_approval_flow.py tests/test_workflow_scheduled_process_restart.py tests/test_recording_review_scope.py tests/test_tool_error_memento_lifecycle.py tests/test_tool_error_evolution.py -q --tb=line --timeout=300 --timeout-method=thread
      - name: Run utility-target regression controls
        env:
          TESTING: "1"
          DATABASE_URL: "sqlite:///test_ci.db"
          SECRET_KEY: "ci-test-secret-key"
          ENVIRONMENT: "development"
        run: |
          python -m pytest tests/test_goal_utility_target.py -q --tb=short --timeout=300 --timeout-method=thread
      - name: Run goal-write authority regression controls
        env:
          TESTING: "1"
          DATABASE_URL: "sqlite:///test_ci.db"
          SECRET_KEY: "ci-test-secret-key"
          ENVIRONMENT: "development"
        run: |
          python -m pytest tests/test_goal_write_authority_contract.py -q --tb=short --timeout=300 --timeout-method=thread
      # Shared registry effect/verifier contract: missing/disabled/refuting
      # verifiers cannot certify applied mutations; real canvas/task/goal/
      # connected families keep their valid twins. Includes the full
      # AssignmentExecutor receipt/restart join and the real mini-app journey.
      - name: Run automatic source-answer continuation controls
        env:
          TESTING: "1"
          DATABASE_URL: "sqlite:///test_ci.db"
          SECRET_KEY: "ci-test-secret-key"
          ENVIRONMENT: "development"
        run: |
          python -m pytest tests/test_task_wait_source_trigger_contract.py tests/test_task_wait_source_continuation_regressions.py tests/test_task_wait_process_recovery.py tests/test_boot_recovery_not_gated_by_scheduler.py tests/test_assignment_routes.py -q --tb=short --timeout=300 --timeout-method=thread
      - name: Run shared ORACLE registry verification controls
        env:
          TESTING: "1"
          DATABASE_URL: "sqlite:///test_ci.db"
          SECRET_KEY: "ci-test-secret-key"
          ENVIRONMENT: "development"
        run: |
          python -m pytest tests/test_oracle_registry_verification_gap.py \
            tests/test_oracle_effect_families.py \
            tests/test_oracle_connected_mutations.py \
            tests/test_assignment_executor.py \
            tests/test_generic_oracle_mutation_contract.py \
            tests/test_generic_request_expectations.py \
            tests/test_generic_reconcile_commit_contract.py \
            tests/test_generic_normal_retry_identity.py \
            tests/test_oracle_mini_app_host_mutations.py \
            tests/test_agent_run_outcome_join_contract.py \
            tests/test_agent_run_admission_contract.py \
            tests/test_agent_job_wait_reference_contract.py \
            tests/test_agent_job_wait_execution_contract.py \
            tests/test_agent_job_wait_scope_contract.py \
            tests/test_agent_job_wait_namespace_contract.py \
            tests/test_agent_job_claim_interleaving.py \
            tests/test_agent_job_delivery_identity.py \
            tests/test_agent_job_outcome_projection.py \
            tests/integration/journeys/test_oracle_registry_mutation_journey.py \
            tests/integration/journeys/test_mini_app_host_receipts_journey.py \
            -q --tb=short --timeout=300 --timeout-method=thread
      # P2.3 memory eval gate: the in-suite gate (test_memory_eval_gate.py)
      # skips under pytest when AI fakes break provider resolution, so run the
      # exit-coded standalone harness for the real recall@k regression gate
      # (golden set, isolated workspace, exit 1 on recall < 1.0).
      - name: Run memory eval gate
        env:
          DATABASE_URL: "sqlite:///test_ci.db"
          SECRET_KEY: "ci-test-secret-key"
          ENVIRONMENT: "development"
          EMBEDDING_PROVIDER: "fastembed"
          FASTEMBED_MODEL: "BAAI/bge-small-en-v1.5"
        run: |
          python -m core.memory_eval

      - name: Run served workflow-route regression control
        env:
          TESTING: "1"
          DATABASE_URL: "sqlite:///test_ci.db"
          SECRET_KEY: "ci-test-secret-key"
          ENVIRONMENT: "development"
        run: |
          python -m pytest tests/test_orch01_served_route_http.py -q --tb=short --timeout=300 --timeout-method=thread

      - name: Run registered alignment-loop regression controls
        env:
          TESTING: "1"
          DATABASE_URL: "sqlite:///test_ci.db"
          SECRET_KEY: "ci-test-secret-key"
          ENVIRONMENT: "development"
        run: |
          python -m pytest tests/test_org_politics_registered_loop_join.py -q --tb=short --timeout=300 --timeout-method=thread

      # MINI-03 runtime-boundary journey (additive): the actual public RPC
      # consumer (POST /api/rpc/mini_app_dev_run / mini_app_run_tests) must
      # fail CLOSED with an explicit actionable runtime-unavailable message
      # on hosts without Firecracker, register no installed instance and
      # persist no state; explicit docker-dev must be refused under
      # ENVIRONMENT=production (the factory gate runs before any Docker
      # contact — deterministic on any host). Repair of the stale
      # mini_app_harness_journey (R87-R89 mandatory AUTONOMOUS canvas-logic
      # gate postdated it) + new focused boundary controls.
      - name: Run mini-app runtime-boundary journey (MINI-03 fail-closed joins)
        env:
          TESTING: "1"
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "ci-test-secret-key"
          ENVIRONMENT: "development"
          ATOM_DATA_DIR: "${{ runner.temp }}/mini03-data"
          LANCEDB_URI: "${{ runner.temp }}/mini03-lance"
          MINIAPP_ROOTFS_DIR: "${{ runner.temp }}/mini03-rootfs"
        run: |
          python -m pytest \
            tests/integration/journeys/test_mini_app_runtime_boundary_journey.py \
            tests/integration/journeys/test_mini_app_harness_journey.py \
            -q --tb=short --timeout=300 --timeout-method=thread

      - name: Run real-process mini-app record restart control
        env:
          TESTING: "1"
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "ci-test-secret-key"
          ENVIRONMENT: "development"
          ATOM_DATA_DIR: "${{ runner.temp }}/mini04-parent-data"
          LANCEDB_URI: "${{ runner.temp }}/mini04-parent-lance"
          MINIAPP_ROOTFS_DIR: "${{ runner.temp }}/mini04-parent-rootfs"
        run: |
          mini04_run_root=$(mktemp -d "${RUNNER_TEMP}/mini04-run-XXXXXX")
          python -m pytest tests/test_mini_app_records_process_restart.py \
            -q --tb=short --timeout=360 --timeout-method=thread \
            --basetemp="${mini04_run_root}/pytest"

  # -------------------------------------------------------------------
  # End-to-end user-journey suite: boots full app + frontend, runs
  # Playwright tests against them.
  # -------------------------------------------------------------------
  e2e-journey:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/tests/e2e_ui
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-nextjs/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Install frontend dependencies
        working-directory: frontend-nextjs
        run: npm install --legacy-peer-deps

      - name: Start full backend (main_api_app) on :8001
        working-directory: backend
        env:
          # ABSOLUTE path so the test step (different cwd) resolves the same DB.
          # The role fixtures write to this DB via the backend's SessionLocal,
          # so both processes must agree on the file location.
          DATABASE_URL: "sqlite:////tmp/atom_e2e.db"
          SECRET_KEY: "ci-e2e-secret-key"
          ENVIRONMENT: "development"
          # MUST match the env var the AuthRateLimiter checks
          # (core/security/auth_rate_limit.py). Without this, the e2e journey
          # tests hit 429 on /api/auth/register.
          BYPASS_RATE_LIMIT: "1"
          ALLOWED_ORIGINS: "http://localhost:3001,http://127.0.0.1:3001"
        run: |
          rm -f /tmp/atom_e2e.db
          python -m uvicorn main_api_app:app --host 127.0.0.1 --port 8001 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 40); do
            curl -fs http://127.0.0.1:8001/alive > /dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "Backend did not become healthy:"; cat /tmp/backend.log | tail -40; exit 1

      - name: Start frontend on :3001
        working-directory: frontend-nextjs
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8001"
          NEXT_PUBLIC_USE_BACKEND_API: "true"
        run: |
          npm run dev -- -p 3001 > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fs http://127.0.0.1:3001 > /dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "Frontend did not become healthy:"; cat /tmp/frontend.log | tail -40; exit 1

      # GATING: API/role/permission/auth/integration journey tests. These hit
      # the backend directly over HTTP — fast and stable — and cover the
      # access-control contract. A failure here blocks the merge.
      - name: Run API journey tests (gating)
        env:
          BACKEND_URL: "http://localhost:8001"
          FRONTEND_URL: "http://localhost:3001"
          # MUST match the backend's DATABASE_URL (absolute path) so the role
          # fixtures' SessionLocal writes to the same DB the backend reads.
          DATABASE_URL: "sqlite:////tmp/atom_e2e.db"
          # backend/ on PYTHONPATH so `from core.database import SessionLocal`
          # works in the role fixtures. $GITHUB_WORKSPACE is repo root.
          PYTHONPATH: "${{ github.workspace }}/backend"
          CI: "true"
        run: |
          python -m pytest tests/test_journey_api_features.py \
            tests/test_journey_role_api.py tests/test_journey_permission_matrix.py \
            tests/test_journey_integrations_health.py \
            tests/test_journey_auth.py \
            -q --tb=short --timeout=180 --timeout-method=thread

      # NON-GATING: browser (Playwright) UI tests. These are the flakiest part
      # of the suite — they spin up a real chromium instance and depend on both
      # the backend (:8001) and the memory-heavy `next dev` server (:3001)
      # staying responsive for the whole run on a constrained GitHub runner.
      # When either server is starved/killed mid-run, the whole browser block
      # times out at `page.goto` (see the original failure on run 29917046025:
      # 28 identical Page.goto timeouts, all API tests green). The gating API
      # journey tests above already cover the access-control contract, so a
      # UI-only flake should not block the merge. Failures are still surfaced
      # loudly via the job summary + uploaded screenshots/logs for triage.
      - name: Run UI journey tests (non-gating)
        env:
          BACKEND_URL: "http://localhost:8001"
          FRONTEND_URL: "http://localhost:3001"
          DATABASE_URL: "sqlite:////tmp/atom_e2e.db"
          PYTHONPATH: "${{ github.workspace }}/backend"
          CI: "true"
        continue-on-error: true
        run: |
          python -m pytest tests/test_journey_ui_features.py \
            tests/test_journey_page_smoke.py tests/test_user_journey.py \
            tests/test_journey_onboarding.py \
            -q --tb=short --ignore=tests/test_journey_role_ui.py
          # Role-UI tests are run separately (they each do a full browser login
          # per role — slower). Allow them to flake without failing the gate;
          # they're covered by the role_api + permission_matrix tests above
          # for the access-control contract.
          python -m pytest tests/test_journey_role_ui.py -q --tb=short \
            || echo "::warning::role-UI journey had failures (non-gating)"

      - name: Dump server logs on failure
        # The startup health checks only print the server log if the server
        # never became healthy. If it died *mid-run* (the common flake), that
        # log is never surfaced — leaving a blind timeout. `always()` so this
        # still fires even though the UI test step above is continue-on-error.
        if: always()
        run: |
          echo "===== /tmp/backend.log (tail 80) ====="
          tail -n 80 /tmp/backend.log 2>/dev/null || echo "(no backend log)"
          echo
          echo "===== /tmp/frontend.log (tail 80) ====="
          tail -n 80 /tmp/frontend.log 2>/dev/null || echo "(no frontend log)"

      - name: Upload screenshots on failure
        # `always()` (not `failure()`) because the UI test step is
        # continue-on-error — a UI-only flake won't mark the job failed, but we
        # still want the Playwright failure screenshots for triage.
        # if-no-files-found makes this a no-op on clean runs.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          # Absolute path — upload-artifact runs at workspace root, not the
          # job's working-directory, so a relative path resolves wrong.
          path: ${{ github.workspace }}/backend/tests/e2e_ui/artifacts/screenshots/
          if-no-files-found: ignore

  # -------------------------------------------------------------------
  # Frontend type check (best-effort; pre-existing errors don't block)
  # -------------------------------------------------------------------
  frontend-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-nextjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-nextjs/package-lock.json
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Type check
        run: npx tsc --noEmit --skipLibCheck
        continue-on-error: true  # Pre-existing errors; don't block PRs yet
      - name: Auth redirect regression tests
        # The middleware must hand the login pages a relative path+query;
        # absolute callbackUrls silently fall back to /dashboard. Keep the
        # same-app/open-redirect twins gated.
        run: npx jest tests/middleware.test.ts tests/lib/auth-headers.test.ts tests/pages/__tests__/login.test.tsx tests/auth/test-signin.test.tsx --runInBand --no-coverage
      - name: Deferred-link regression tests
        # Core profile must not link deferred governance/connector surfaces.
        run: npx jest tests/pages/settings-index.test.tsx tests/components/AssignmentPanel.test.tsx --runInBand --no-coverage
      - name: Assignment source-answer regression tests
        # The source event owns continuation; the UI must not advance again.
        run: npx jest components/assignments/__tests__/AssignmentPanel.test.tsx --runInBand --no-coverage
      - name: Agents release-surface regression tests
        # Core profile must not advertise deferred Marketplace/Automations.
        run: npx jest tests/pages/agents-index.test.tsx --runInBand --no-coverage
      - name: Release-surface regression tests
        # Documents must not advertise deferred search; the card follows the
        # existing product-profile capability and keeps a supported next action.
        run: npx jest tests/pages/documents.test.tsx --runInBand --no-coverage
