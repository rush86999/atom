  backend-tests:
    needs: [backend-core, backend-oracle]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every backend lane to succeed
        env:
          ATOM_CI_CORE_RESULT: ${{ needs.backend-core.result }}
          ATOM_CI_ORACLE_RESULT: ${{ needs.backend-oracle.result }}
        run: |
          if [ "$ATOM_CI_CORE_RESULT" != "success" ] || [ "$ATOM_CI_ORACLE_RESULT" != "success" ]; then
            echo "A required backend lane did not succeed."
            exit 1
          fi
          echo "Every required backend lane succeeded."


  # -------------------------------------------------------------------
  # End-to-end user-journey suite: boots full app + frontend, runs
  # Playwright tests against them.
  # -------------------------------------------------------------------
  e2e-journey:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/tests/e2e_ui
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-nextjs/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Install frontend dependencies
        working-directory: frontend-nextjs
        run: npm install --legacy-peer-deps

      - name: Start full backend (main_api_app) on :8001
        working-directory: backend
        env:
          # ABSOLUTE path so the test step (different cwd) resolves the same DB.
          # The role fixtures write to this DB via the backend's SessionLocal,
          # so both processes must agree on the file location.
          DATABASE_URL: "sqlite:////tmp/atom_e2e.db"
          SECRET_KEY: "ci-e2e-secret-key"
          ENVIRONMENT: "development"
          # MUST match the env var the AuthRateLimiter checks
          # (core/security/auth_rate_limit.py). Without this, the e2e journey
          # tests hit 429 on /api/auth/register.
          BYPASS_RATE_LIMIT: "1"
          ALLOWED_ORIGINS: "http://localhost:3001,http://127.0.0.1:3001"
        run: |
          rm -f /tmp/atom_e2e.db
          python -m uvicorn main_api_app:app --host 127.0.0.1 --port 8001 > /tmp/backend.log 2>&1 &
          for i in $(seq 1 40); do
            curl -fs http://127.0.0.1:8001/alive > /dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "Backend did not become healthy:"; cat /tmp/backend.log | tail -40; exit 1

      - name: Start frontend on :3001
        working-directory: frontend-nextjs
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8001"
          NEXT_PUBLIC_USE_BACKEND_API: "true"
          BACKEND_URL: "http://127.0.0.1:8001"
          NEXTAUTH_URL: "http://localhost:3001"
        run: |
          # The real session issuer fails closed without its own configured key.
          # Generate only for this isolated runner; never reuse the backend key.
          export NEXTAUTH_SECRET="$(node -e "process.stdout.write(require('node:crypto').randomBytes(48).toString('base64url'))")"
          echo "::add-mask::$NEXTAUTH_SECRET"
          npm run dev -- -p 3001 > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fs http://127.0.0.1:3001 > /dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "Frontend did not become healthy:"; cat /tmp/frontend.log | tail -40; exit 1

      # GATING: API/role/permission/auth/integration journey tests. These hit
      # the backend directly over HTTP — fast and stable — and cover the
      # access-control contract. A failure here blocks the merge.
      - name: Run API journey tests (gating)
        env:
          BACKEND_URL: "http://localhost:8001"
          FRONTEND_URL: "http://localhost:3001"
          # MUST match the backend's DATABASE_URL (absolute path) so the role
          # fixtures' SessionLocal writes to the same DB the backend reads.
          DATABASE_URL: "sqlite:////tmp/atom_e2e.db"
          # backend/ on PYTHONPATH so `from core.database import SessionLocal`
          # works in the role fixtures. $GITHUB_WORKSPACE is repo root.
          PYTHONPATH: "${{ github.workspace }}/backend"
          CI: "true"
        run: |
          python -m pytest tests/test_journey_api_features.py \
            tests/test_journey_role_api.py tests/test_journey_permission_matrix.py \
            tests/test_journey_integrations_health.py \
            tests/test_journey_auth.py \
            -q --tb=short --timeout=180 --timeout-method=thread

      # NON-GATING: browser (Playwright) UI tests. These are the flakiest part
      # of the suite — they spin up a real chromium instance and depend on both
      # the backend (:8001) and the memory-heavy `next dev` server (:3001)
      # staying responsive for the whole run on a constrained GitHub runner.
      # When either server is starved/killed mid-run, the whole browser block
      # times out at `page.goto` (see the original failure on run 29917046025:
      # 28 identical Page.goto timeouts, all API tests green). The gating API
      # journey tests above already cover the access-control contract, so a
      # UI-only flake should not block the merge. Failures are still surfaced
      # loudly via the job summary + uploaded screenshots/logs for triage.
      - name: Run UI journey tests (non-gating)
        env:
          BACKEND_URL: "http://localhost:8001"
          FRONTEND_URL: "http://localhost:3001"
          DATABASE_URL: "sqlite:////tmp/atom_e2e.db"
          PYTHONPATH: "${{ github.workspace }}/backend"
          CI: "true"
        continue-on-error: true
        run: |
          python -m pytest tests/test_journey_ui_features.py \
            tests/test_journey_page_smoke.py tests/test_user_journey.py \
            tests/test_journey_onboarding.py \
            -q --tb=short --ignore=tests/test_journey_role_ui.py
          # Role-UI tests are run separately (they each do a full browser login
          # per role — slower). Allow them to flake without failing the gate;
          # they're covered by the role_api + permission_matrix tests above
          # for the access-control contract.
          python -m pytest tests/test_journey_role_ui.py -q --tb=short \
            || echo "::warning::role-UI journey had failures (non-gating)"

      - name: Dump server logs on failure
        # The startup health checks only print the server log if the server
        # never became healthy. If it died *mid-run* (the common flake), that
        # log is never surfaced — leaving a blind timeout. `always()` so this
        # still fires even though the UI test step above is continue-on-error.
        if: always()
        run: |
          echo "===== /tmp/backend.log (tail 80) ====="
          tail -n 80 /tmp/backend.log 2>/dev/null || echo "(no backend log)"
          echo
          echo "===== /tmp/frontend.log (tail 80) ====="
          tail -n 80 /tmp/frontend.log 2>/dev/null || echo "(no frontend log)"

      - name: Upload screenshots on failure
        # `always()` (not `failure()`) because the UI test step is
        # continue-on-error — a UI-only flake won't mark the job failed, but we
        # still want the Playwright failure screenshots for triage.
        # if-no-files-found makes this a no-op on clean runs.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          # Absolute path — upload-artifact runs at workspace root, not the
          # job's working-directory, so a relative path resolves wrong.
          path: ${{ github.workspace }}/backend/tests/e2e_ui/artifacts/screenshots/
          if-no-files-found: ignore

  # -------------------------------------------------------------------
  # Frontend type check (best-effort; pre-existing errors don't block)
  # -------------------------------------------------------------------
  frontend-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-nextjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-nextjs/package-lock.json
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Type check
        run: npx tsc --noEmit --skipLibCheck
        continue-on-error: true  # Pre-existing errors; don't block PRs yet
      - name: Tasks and Projects authority and confirmation controls
        run: |
          npx jest tests/components/task-mutation-confirmation.test.tsx components/shared/__tests__/TaskManagement.test.tsx components/__tests__/TaskManagement.test.tsx tests/components/task-management-data-loading.test.tsx tests/lib/auth-headers.test.ts tests/pages/api/__tests__/v1-tasks-id.test.ts tests/pages/api/__tests__/v1-financial-workflow.test.ts --runInBand --no-coverage --watchman=false
          node --test tests/contracts/task-project-public-boundary.cjs
      - name: Password recovery receipt and proxy controls
        run: 'npx jest tests/auth/signin-logout-return-contract.test.tsx tests/components/sidebar-logout-contract.test.tsx components/layout/__tests__/Sidebar.gating.test.tsx tests/lib/backend-credentials.test.ts tests/lib/backend-signin-identity.test.ts tests/lib/backend-session-logout.test.ts tests/pages/api/__tests__/auth-forgot-password.test.ts tests/pages/api/__tests__/auth-reset-password.test.ts tests/auth/test-forgot-password.test.tsx tests/auth/test-reset-password.test.tsx tests/lib/api-error-message.test.ts tests/pages/__tests__/settings-account.test.tsx --runInBand --no-coverage --watchman=false

          '
      - name: Quickstart persistent web configuration contract
        run: python3 -m unittest discover -s ../scripts/tests -p 'test_setup_web_auth.py'
      - name: Authenticated skills catalogue and shared proxy contracts
        run: |
          node --test tests/contracts/skills-proxy-authority.cjs
          npx jest tests/pages/api/__tests__/skills-list.test.ts components/Automations/__tests__/test-pieces-sidebar.test.tsx --runInBand --no-coverage --watchman=false
      - name: Production TypeScript error rejection and valid build twin
        run: node --test tests/contracts/production-type-gate.cjs
      - name: Production and development cookie policy contract
        run: node --test tests/contracts/nextauth-cookie-policy.cjs tests/contracts/production-middleware-session.cjs
      - name: Current backend principal session contract
        run: node --test tests/contracts/nextauth-current-principal.cjs
      - name: Auth redirect regression tests
        # The middleware must hand the login pages a relative path+query;
        # absolute callbackUrls silently fall back to /dashboard. Keep the
        # same-app/open-redirect twins gated.
        run: npx jest tests/middleware.test.ts tests/lib/auth-headers.test.ts tests/pages/__tests__/login.test.tsx tests/auth/test-signin.test.tsx --runInBand --no-coverage
      - name: RPC failure-consumer regression tests
        # Body-level action failures must keep the handler's typed result in
        # RpcError.actionResult (generic global message), and MiniAppHarness
        # must render that already-exposed error while transport/HTTP failures
        # stay generic. Guards the RPC envelope -> shared client -> harness
        # consumer class.
        run: npx jest tests/lib/rpc-client-failure.test.ts tests/components/mini-app-harness-rpc-failure.test.tsx --runInBand --no-coverage
      - name: Run agent information question UI controls
        working-directory: frontend-nextjs
        run: npx jest components/Agents/__tests__/AgentJobWaitPanel.test.tsx lib/__tests__/agent-job-ref.test.ts tests/pages/agents-index.test.tsx tests/pages/agents-information-job.test.tsx --runInBand --no-coverage
      - name: Graduation outcome and client retry regression tests
        working-directory: frontend-nextjs
        # Positive HTTP alone is not promotion; opt-out must reach the shared
        # retry interceptor so an uncertain mutation is never re-dispatched.
        run: npx jest lib/__tests__/api/maturity-api.test.ts tests/pages/approvals-page.test.tsx components/canvas/__tests__/TrainingPanel.test.tsx lib/__tests__/api-interceptors.test.ts components/Agents/__tests__/AgentMaturityGuide.test.tsx components/Agents/__tests__/SelfDirectedPathwayCard.test.tsx --runInBand --no-coverage --watchman=false
