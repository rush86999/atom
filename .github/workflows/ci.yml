        working-directory: frontend-nextjs
        run: npx jest tests/pages/goal-runs/detail.test.tsx --runInBand --no-coverage
      - name: Deferred-link regression tests
        # Core profile must not link deferred governance/connector surfaces.
        run: npx jest tests/pages/settings-index.test.tsx tests/components/AssignmentPanel.test.tsx --runInBand --no-coverage
      - name: Assignment source-answer regression tests
        # The source event owns continuation; the UI must not advance again.
