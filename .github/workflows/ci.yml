name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # -------------------------------------------------------------------
  # Syntax gate (fast, dependency-free): every shipped backend module
  # must COMPILE under Python 3.11 — the published floor
  # (pyproject requires-python ">=3.11"; CI and both Dockerfiles run
  # 3.11 images). 2026-10-10 incident: a 3.12+-only multiline f-string
  # (PEP 701) shipped and left every planner-importing suite unrunnable
  # under 3.11 while the 3.14 serving venv masked it. The exclusions
  # below are the genuinely archived trees ONLY (core/archive,
  # .archive, test_archives_*, scripts/dev one-offs) plus environments
  # and build output — anything else that fails to compile under 3.11
  # fails this gate.
  # -------------------------------------------------------------------
  syntax-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile all shipped backend modules under 3.11
        run: |
          python -m compileall -q -f -x '(^|/)(venv314|venv|node_modules|data|logs|__pycache__|coverage_html_batch|coverage_reports|htmlcov|\.pytest_cache|\.archive|archive|test_archives_[0-9]+_[0-9]+|scripts/dev)(/|$)' .
          echo "3.11 compile gate passed"
      - name: Check source-bound documentation inventory boundaries
        working-directory: ${{ github.workspace }}
        run: python -m unittest discover -s scripts/docs -p test_inventory_reference.py

  # -------------------------------------------------------------------
  # Fast: does the full app even import + boot? (guards against the
  # historical "main_api_app is broken" regression)
  # -------------------------------------------------------------------
  full-app-boots:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Boot the full app (main_api_app) and hit /alive
        env:
          DATABASE_URL: "sqlite:///test_ci.db"
          SECRET_KEY: "ci-test-secret-key"
          ENVIRONMENT: "development"
          BYPASS_RATE_LIMIT: "1"
        run: |
          # Import first — surfaces any router/middleware error loudly.
          python -c "import main_api_app; print('import OK')"
          # Boot in the background and probe the health endpoint.
          python -m uvicorn main_api_app:app --host 127.0.0.1 --port 8001 &
          BACKEND_PID=$!
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:8001/alive > /dev/null 2>&1; then
              echo "Backend alive"; exit 0
            fi
            sleep 2
          done
          echo "Backend failed to boot"; kill $BACKEND_PID 2>/dev/null || true; exit 1

  # -------------------------------------------------------------------
  # Install path: does the documented `make setup` quickstart actually
  # work end-to-end for a new user? (venv, deps, .env generation)
  # -------------------------------------------------------------------
  quickstart-install:
    name: quickstart-install (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify fresh installation directories
        run: |
          test ! -e backend/venv
          test ! -e frontend-nextjs/node_modules
      - name: Run make setup (quickstart.sh)
        run: make setup
      - name: Verify storage binary compatibility
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: backend/venv/bin/python scripts/ci/verify_quickstart_storage.py
      - name: Verify setup artifacts
        run: |
          test -d backend/venv
          test -f backend/.env
          test -d frontend-nextjs/node_modules
          test -f frontend-nextjs/.env.local
          grep -q "SECRET_KEY=" backend/.env
          echo "Quickstart artifacts OK"
      - name: Boot the full app from the generated env
        working-directory: backend
        run: |
          source venv/bin/activate
          python -m uvicorn main_api_app:app --host 127.0.0.1 --port 8001 > /tmp/quickstart-backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:8001/alive > /dev/null 2>&1 && { echo "Backend alive from quickstart env"; exit 0; }
            sleep 2
          done
          echo "Backend failed to boot from quickstart env:"; tail -40 /tmp/quickstart-backend.log; exit 1

  quickstart:
    runs-on: ubuntu-latest
    needs: [quickstart-install]
    if: ${{ always() }}
    steps:
      - name: Require every supported interpreter installation
        env:
          ATOM_CI_QUICKSTART_RESULT: ${{ needs.quickstart-install.result }}
        run: test "$ATOM_CI_QUICKSTART_RESULT" = "success"

  # -------------------------------------------------------------------
  # Backend unit tests (unchanged set, fast feedback)
  # -------------------------------------------------------------------
  backend-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run backend lane preservation contract
        env:
          TESTING: "1"
          DATABASE_URL: "sqlite:///test_ci.db"
          SECRET_KEY: "ci-test-secret-key"
          ENVIRONMENT: "development"
        run: |
          python -m pytest tests/test_ci_backend_lane_contract.py tests/test_quickstart_matrix_contract.py -q --tb=short --timeout=300 --timeout-method=thread
      - name: Run cache benchmark reproducer contract
        timeout-minutes: 3
        env:
          TESTING: "1"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pytest --noconftest tests/test_governance_cache_benchmark_cli.py -q --tb=short
      - name: Run backend tests
        env:
          DATABASE_URL: "sqlite:///test_ci.db"
          SECRET_KEY: "ci-test-secret-key"
          ENVIRONMENT: "development"
          PYTEST_CURRENT_TEST: "1"
        run: |
          # --timeout seatbelt: a hung test fails at 5 min (thread stacks dumped
          # for triage) instead of burning the 6h job limit — the 2026-09-05
          # run hung 6h on one test (exhausted MagicMock side_effect raised
          # StopIteration inside to_thread; fixed in byok_handler + w27 test).
          python -m pytest tests/test_integration_http.py tests/test_local_models.py tests/test_routing_feedback_endpoint.py tests/test_phase_integration.py tests/test_response_quality.py tests/test_routing_trainer_integration.py tests/test_routing_db_persistence.py tests/test_round17b_fixes.py tests/test_learning_routing.py tests/test_learning_llm_router.py tests/test_workbook_runtime.py tests/test_canvas_crud.py tests/test_openrouter_provider.py tests/test_provider_wiring.py tests/api/test_a2a_routes.py tests/api/test_sso_oidc_routes.py tests/api/test_scim_routes.py tests/core/test_observability_tracing.py tests/core/test_oracle_and_two_tier_confidence.py tests/test_memory_p2.py tests/test_memory_consolidator_llm.py tests/test_memory_eval_gate.py tests/test_memory_backfill_unified.py tests/test_opencode_go_provider.py tests/test_covpush_w27_opencode_retry.py tests/test_covpush_w57_byok_handler_a.py tests/test_covpush_w57_byok_handler_d.py tests/unit/core/test_stage_router_wiring.py tests/unit/core/test_traffic_split.py tests/test_deepseek_harness_gaps.py tests/test_stream_retry_state_contract.py tests/test_community_skill_write_contract.py tests/test_quickstart_python_guard.py tests/test_workflow_hitl_resume_once.py tests/test_workflow_hitl_persisted_resume.py tests/test_workflow_scheduler_recovery.py tests/test_workflow_approval_scope.py tests/test_workflow_public_approval_flow.py tests/test_workflow_scheduled_process_restart.py tests/test_recording_review_scope.py tests/test_tool_error_memento_lifecycle.py tests/test_tool_error_evolution.py tests/test_employee_business_feedback.py tests/test_employee_feedback_interleaving.py tests/test_feedback_cas_dialect_contract.py tests/test_bpe_current_principal_scope.py tests/test_lead_bpe_rpc_scope.py tests/core/test_bpe_persistence_write_truth.py tests/core/test_bpe_persistence_path_anchoring.py tests/core/test_bpe_evolution.py tests/test_generic_information_multiday_contract.py tests/test_canvas_lifecycle_verified.py tests/test_lead_canvas_lifecycle_authority.py tests/core/test_bpe_persistence_namespace_identity.py tests/test_bpe_note_commit_outcome.py -q --tb=line --timeout=300 --timeout-method=thread
      - name: Run verified form presentation and submission controls
