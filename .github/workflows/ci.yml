      # Shared registry effect/verifier contract: missing/disabled/refuting
      # verifiers cannot certify applied mutations; real canvas/task/goal/
      # connected families keep their valid twins. Includes the full
      # AssignmentExecutor receipt/restart join and the real mini-app journey.
      - name: Run automatic source-answer continuation controls
        env:
          TESTING: "1"
          DATABASE_URL: "sqlite:///test_ci.db"
          SECRET_KEY: "ci-test-secret-key"
          ENVIRONMENT: "development"
        run: |
          python -m pytest tests/test_task_wait_source_trigger_contract.py tests/test_task_wait_source_continuation_regressions.py tests/test_task_wait_two_fact_events.py tests/test_task_wait_two_job_isolation.py tests/test_task_wait_source_revocation.py tests/test_task_wait_source_version_after_acceptance.py tests/test_lead_wait_source_disappears.py tests/test_lead_wait_source_progress_and_extraction.py tests/test_lead_wait_missing_authoritative_revision.py tests/test_employee_prerequisite_eligibility.py tests/test_sequential_fact_completion_contract.py tests/test_task_wait_process_recovery.py tests/test_task_wait_independent_work.py tests/test_task_wait_artifact_content_contract.py tests/test_employee_work_requests.py tests/test_employee_work_request_matrix.py tests/test_employee_durable_wait_g5.py tests/test_employee_evidence_change_g5.py tests/test_employee_adaptation_contract.py tests/test_employee_compiler_question_contract.py tests/test_boot_recovery_not_gated_by_scheduler.py tests/test_assignment_routes.py tests/test_assignment_external_reply_identity.py tests/test_assignment_gap_reply_identity.py tests/test_external_fact_recovery_identity.py tests/test_goal_wake_failure_boundary.py tests/test_gap_settlement_operation_guard.py tests/test_goal_run_events.py tests/test_root_clarification_continuation.py tests/test_root_gap_operation_settlement_guard.py tests/test_root_assignment_reply_material_probe.py tests/test_employee_two_domain_campaign.py -q --tb=short --timeout=300 --timeout-method=thread
      - name: Run evidence manifest Git-ref controls
