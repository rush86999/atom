version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atom_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atom_password}
      POSTGRES_DB: ${POSTGRES_DB:-atom_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - atom_network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atom_user} -d ${POSTGRES_DB:-atom_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API with MCP Support
  atom-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-atom_user}:${POSTGRES_PASSWORD:-atom_password}@postgres:5432/${POSTGRES_DB:-atom_db}
      - BYOK_ENCRYPTION_KEY=${BYOK_ENCRYPTION_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - BRAVE_SEARCH_API_KEY=${BRAVE_SEARCH_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - NODE_ENGINE_URL=http://atom-piece-engine:3003
      - SCHEDULER_JOB_STORE_URL=${SCHEDULER_JOB_STORE_URL:-sqlite:////app/backend/scheduler-data/jobs.sqlite}
      - SCHEDULER_SQLITE_OWNERSHIP_LOCK=${SCHEDULER_SQLITE_OWNERSHIP_LOCK:-true}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - scheduler_data:/app/backend/scheduler-data
    networks:
      - atom_network

  # Frontend Next.js App
  atom-frontend:
    build:
      context: ./frontend-nextjs
      dockerfile: Dockerfile.production
      args:
        # Public browser origin compiled into the client bundle. Override with
        # a remote public origin when the browser is not on this host.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8001}
        # Loopback is opt-in only: set 1 for a same-host browser (for example
        # http://localhost:8001); leave 0 for a remote public origin.
        NEXT_PUBLIC_ALLOW_LOOPBACK: ${NEXT_PUBLIC_ALLOW_LOOPBACK:-0}
        # Server-side rewrites use the Compose service DNS, not localhost.
        BACKEND_URL: http://atom-backend:8000
    ports:
      - "3000:3000"
    environment:
      # Runtime web auth and same-origin server requests reach the backend by
      # service DNS; this is separate from the browser-facing public URL.
      - BACKEND_URL=http://atom-backend:8000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - atom_network

  # Node.js Piece Engine (ActivePieces)
  atom-piece-engine:
    build:
      context: ./backend/piece-engine
      dockerfile: Dockerfile
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - atom_network

  # Browserless Chrome (for scraping/automation)
  browser-node:
    image: browserless/chrome:latest
    ports:
      - "3001:3000" # Changed to 3001 to avoid conflict with frontend
    environment:
      - MAX_CONCURRENT_SESSIONS=10
      - MAX_QUEUE_LENGTH=5
      - PREBOOT_CHROME=true
    restart: unless-stopped
    networks:
      - atom_network

volumes:
  postgres_data:
  scheduler_data:


networks:
  atom_network:
    driver: bridge
